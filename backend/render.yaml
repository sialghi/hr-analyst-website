services:
  - type: web
    name: hr-analyst-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
