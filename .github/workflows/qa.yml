name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
        env:
          DATABASE_URL: "sqlite:///:memory:"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check QA test lint
        working-directory: frontend
        run: npm run lint:qa
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
